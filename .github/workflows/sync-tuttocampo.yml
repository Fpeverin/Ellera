name: Sincronizza Altre Partite da TuttoCampo

# Aggiorna automaticamente "Altre Partite" (app/eventi/partita/[id]/altrePartite.tsx) con i
# risultati reali delle altre squadre del girone, presi da TuttoCampo.it — vedi
# App/scripts/sync-tuttocampo.js. Richiede 4 variabili/secret configurati su GitHub (Settings ->
# Secrets and variables -> Actions), vedi commento nello script per il significato di ciascuna:
#   - secrets.SUPABASE_SERVICE_ROLE_KEY   (Secret — MAI come variabile in chiaro)
#   - vars.TEAMBOARD_ORG_ID
#   - vars.TUTTOCAMPO_COMPETITION_NAME
#   - vars.TUTTOCAMPO_LEAGUE_URL
# (vars.EXPO_PUBLIC_SUPABASE_URL è già configurata, usata anche da eas-update.yml.)

on:
  schedule:
    # 07:00 UTC ogni giorno (8-9 ora italiana a seconda dell'ora legale) — dopo le partite del
    # weekend, in tempo per il lunedì.
    - cron: '0 7 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa le dipendenze
        run: npm ci

      - name: Installa Chromium per Playwright
        run: npx playwright install chromium --with-deps

      - name: Sincronizza da TuttoCampo
        env:
          SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEAMBOARD_ORG_ID: ${{ vars.TEAMBOARD_ORG_ID }}
          TUTTOCAMPO_COMPETITION_NAME: ${{ vars.TUTTOCAMPO_COMPETITION_NAME }}
          TUTTOCAMPO_LEAGUE_URL: ${{ vars.TUTTOCAMPO_LEAGUE_URL }}
        run: npm run sync:tuttocampo
